name: Release Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  execute-release-gate:
    name: Run ./run_tests.sh (PostgreSQL Integration)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inspect Repository Structure
        run: |
          echo "========== CURRENT DIRECTORY =========="
          pwd
          echo "========== ROOT CONTENTS =========="
          ls -la
          echo "========== REPOSITORY TREE =========="
          find . -maxdepth 3 -type f | sort
          echo "========== DEPENDENCY FILES =========="
          find . -type f \( -name "requirements.txt" -o -name "pyproject.toml" -o -name "Pipfile" -o -name "poetry.lock" \) -print
          echo "========== RELEASE FILES =========="
          find . -type f \( -name "run_tests.sh" -o -name "alembic.ini" \) -print
          echo "========== APPLICATION DIRECTORIES =========="
          find . -maxdepth 4 -type d \( -name "app" -o -name "tests" -o -name "alembic" \) -print

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Grant execution rights to Test Runner
        run: chmod +x run_tests.sh

      - name: Execute Release Gate (Docker & PostgreSQL)
        run: ./run_tests.sh

      - name: Upload Container Logs on Failure
        if: failure()
        run: |
          echo "Dumping sbm_test_db container logs for root cause analysis:"
          docker logs sbm_test_db || echo "Container already destroyed or not found."
