name: Release Verification Gate

يتم التشغيل عند الرفع على الفرع الرئيسي أو عبر Pull Requests، أو يدوياً

on:
push:
branches: [ main ]
pull_request:
branches: [ main ]
workflow_dispatch:

jobs:
execute-release-gate:
name: Run ./run_tests.sh (PostgreSQL Integration)
runs-on: ubuntu-latest

steps:  
  - name: Checkout Code  
    uses: actions/checkout@v4  

  - name: Set up Python 3.10  
    uses: actions/setup-python@v5  
    with:  
      python-version: '3.10'  
      cache: 'pip' # تسريع تثبيت الاعتماديات عبر التخزين المؤقت  

  - name: Install Project Dependencies  
    run: |  
      python -m pip install --upgrade pip  
      pip install -r requirements.txt  

  - name: Grant execution rights to Test Runner  
    run: chmod +x run_tests.sh  

  - name: Execute Release Gate (Docker & PostgreSQL)  
    # يقوم السكربت الداخلي بإدارة Docker Compose، الانتظار، الاختبار، والتنظيف.  
    # إذا انتهى السكربت بـ exit code غير الصفر، ستفشل هذه الخطوة والـ Workflow بأكمله.  
    run: ./run_tests.sh  
      
  - name: Upload Container Logs on Failure  
    # هذه الخطوة تعمل فقط إذا فشلت الخطوات السابقة، لضمان التقاط سجلات قاعدة البيانات للتشخيص  
    if: failure()  
    run: |  
      echo "Dumping sbm_test_db container logs for root cause analysis:"  
      docker logs sbm_test_db || echo "Container already destroyed or not found."

هل هذا
